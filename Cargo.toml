[package]
name = "egui-rust-wgpu-hello"
version = "1.0.0"
edition = "2021"

[dependencies]
egui = "0.31.1"
egui-wgpu = { version = "0.31.1",features = ["winit"] }
egui-winit = "0.31.1"
winit = "0.30.9"
pollster = "0.4.0"
egui_material_icons = "0.3.0"
pulldown-cmark = "0.13.0"
egui_commonmark = { version = "0.20.0", features = [
    "better_syntax_highlighting",
    "svg",
    "fetch",
    "embedded_image",
]}
reqwest = { version = "0.12.22", features = ["blocking"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",  # JPEG support
    "png",   # PNG support
    "gif",   # GIF support
    "webp",  # WebP support
    "tiff",  # TIFF support
]}
